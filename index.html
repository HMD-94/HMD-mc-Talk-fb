<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HMD Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fb;--panel:#fff;--panel2:#ebe8f6;--line:#d9d4ec;--tx:#1b1830;--mut:#6d6890;--acc:#d98a00;--acc-tx:#1b1200;--teal:#0a9d96;--mine:#efe3c4;--bad:#d1384f;--ok:#1f9d5c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#100e1b;--panel:#1a1729;--panel2:#241f38;--line:#322c4d;--tx:#eeebfa;--mut:#9a93bd;--acc:#f2b544;--acc-tx:#1d1400;--teal:#3fd0c9;--mine:#3a3020;--bad:#ff6b81;--ok:#4cd68c}}
:root[data-theme=dark]{--bg:#100e1b;--panel:#1a1729;--panel2:#241f38;--line:#322c4d;--tx:#eeebfa;--mut:#9a93bd;--acc:#f2b544;--acc-tx:#1d1400;--teal:#3fd0c9;--mine:#3a3020;--bad:#ff6b81;--ok:#4cd68c}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--acc);color:var(--acc-tx);font-weight:600;padding:11px 18px;border-radius:12px}
.btn.ghost{background:var(--panel2);color:var(--tx)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
input{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus{outline:2px solid var(--acc);border-color:transparent}
select{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
/* auth */
#auth{height:100%;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(900px 500px at 15% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--teal) 20%,transparent),transparent)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:30px;font-weight:700;letter-spacing:-.03em}.logo b{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;line-height:1.5;white-space:pre-line}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--tx)}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* app */
#app{height:100%;display:grid;grid-template-columns:320px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between}
#list{flex:1;overflow:auto;padding:4px 10px;display:flex;flex-direction:column;gap:4px}
.ci{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;text-align:left;width:100%}
.ci:hover{background:var(--panel2)}.ci.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none;background:var(--panel2);color:var(--acc)}
.av.mc{background:linear-gradient(135deg,#5b8a3c,#8b5a2b);color:#fff}
.ci .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci .s{font-size:12px;color:var(--mut)}
.ci>div{min-width:0}
.me{border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h2{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#burger{display:none;font-size:22px;padding:2px 8px}
.mt{display:flex;gap:4px;padding:8px 16px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow:auto}
.mt button{padding:9px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.mt button.on{color:var(--tx);border-color:var(--acc)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(560px,82%);background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 13px;align-self:flex-start}
.m.me2{align-self:flex-end;background:var(--mine);border-radius:16px 16px 4px 16px}
.m .w{font-size:12px;color:var(--teal);font-weight:600;margin-bottom:2px}.m .t{overflow-wrap:anywhere;white-space:pre-wrap}
.tag{font-size:11px;background:#5b8a3c;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.sys{align-self:center;color:var(--mut);font-size:12.5px;background:var(--panel2);padding:4px 12px;border-radius:99px;text-align:center}
.compose{display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.empty{margin:auto;text-align:center;color:var(--mut);padding:24px;max-width:340px;line-height:1.6}
.empty h3{color:var(--tx);margin-bottom:6px}
.pad{padding:18px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.code{font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--acc)}
.cmd{background:var(--panel2);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:6px}.dot.ok{background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}
#map{width:100%;flex:1;min-height:260px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
#con{background:#0b0a12;color:#cfe9d0;border-radius:12px;padding:12px;height:240px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(5,4,12,.6);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{max-height:90%;overflow:auto}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}
@media(max-width:800px){
#app{grid-template-columns:1fr}
#side{position:fixed;inset:0;z-index:10;width:100%;transform:translateX(-100%);transition:transform .2s}
#side.open{transform:none}
#burger{display:block}
.m{max-width:90%}
}
@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>

<section id="auth" class="hide">
  <form class="card" id="af" autocomplete="off">
    <div class="logo">HMD<b>.</b>Hub</div>
    <p class="sub">Discute avec tes potes et pilote ton serveur Minecraft au même endroit.</p>
    <div class="sub hide" id="inv" style="color:var(--acc);font-weight:600"></div>
    <div class="tabs"><button type="button" id="tl" class="on">Connexion</button><button type="button" id="tr">Créer un compte</button></div>
    <input id="u" placeholder="Nom d’utilisateur" maxlength="20" autocapitalize="none" required>
    <input id="p1" type="password" placeholder="Mot de passe" required>
    <input id="p2" type="password" placeholder="Répète le mot de passe" class="hide">
    <div class="err" id="ae"></div>
    <button class="btn" id="ab">Se connecter</button>
  </form>
</section>

<section id="app" class="hide">
  <aside id="side">
    <div class="sh"><div class="logo" style="font-size:22px">HMD<b>.</b>Hub</div>
      <div class="row"><button class="btn sm" id="nw">Nouveau</button><button class="btn sm ghost" id="cl" aria-label="Fermer" style="display:none">✕</button></div></div>
    <div id="list"></div>
    <div class="me"><div style="min-width:0"><div id="mn" style="font-weight:600;overflow:hidden;text-overflow:ellipsis"></div><div class="sub" style="font-size:12px">Connecté</div></div><button class="btn sm ghost" id="lo">Quitter</button></div>
  </aside>
  <main id="main"></main>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCZX09Kc3TXZniSbGt9jAP_Ml0BT7Q4uR8",
  authDomain: "hmd-hub.firebaseapp.com",
  projectId: "hmd-hub",
  storageBucket: "hmd-hub.firebasestorage.app",
  messagingSenderId: "145481795853",
  appId: "1:145481795853:web:c7faffc0dffcddacc3c844",
  measurementId: "G-QJCH8CBDBG"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ADMIN_PW = "1937";
let me = null, convs = [], cur = null, tab = "chat", adminOK = false, unsubs = [], listUn = null;
const clean = n => n.toLowerCase().replace(/[^a-z0-9_]/g, "");
const mail = n => clean(n) + "@hmd-hub.app";
function toast(t, ms) { const d = el("div", "", t); d.id = "toast"; document.body.append(d); setTimeout(() => d.remove(), ms || 2600); }
function stop() { unsubs.forEach(f => f()); unsubs = []; }

/* ---------- Auth ---------- */
let reg = false;
function mode(r) { reg = r; $("#tl").classList.toggle("on", !r); $("#tr").classList.toggle("on", r); $("#p2").classList.toggle("hide", !r); $("#ab").textContent = r ? "Créer mon compte" : "Se connecter"; $("#ae").textContent = ""; }
$("#tl").onclick = () => mode(false); $("#tr").onclick = () => mode(true);
$("#af").onsubmit = async e => {
  e.preventDefault(); const n = $("#u").value.trim(), p = $("#p1").value, err = $("#ae"); err.textContent = "";
  if (!/^[A-Za-z0-9_]{3,20}$/.test(n)) return err.textContent = "Le nom doit faire 3 à 20 caractères : lettres, chiffres ou _.";
  try {
    if (reg) {
      if (p.length < 6) return err.textContent = "Le mot de passe doit faire au moins 6 caractères.";
      if (p !== $("#p2").value) return err.textContent = "Les deux mots de passe sont différents.";
      registering = true; const c = await auth.createUserWithEmailAndPassword(mail(n), p);
      await c.user.updateProfile({ displayName: n });
      await db.collection("users").doc(c.user.uid).set({ name: n, nameLower: clean(n) });
      me = { uid: c.user.uid, name: n }; start(); registering = false; if (pendingJoin) joinInvite();
    } else await auth.signInWithEmailAndPassword(mail(n), p);
  } catch (x) {
    registering = false;
    const m = { "auth/email-already-in-use": "Ce nom est déjà pris.", "auth/invalid-credential": "Nom ou mot de passe incorrect.", "auth/wrong-password": "Nom ou mot de passe incorrect.", "auth/user-not-found": "Nom ou mot de passe incorrect.", "auth/operation-not-allowed": "Active la connexion Email/Mot de passe dans Firebase Authentication." };
    err.textContent = m[x.code] || x.message;
  }
};
$("#lo").onclick = () => auth.signOut();
let pendingJoin = new URLSearchParams(location.search).get("join"), registering = false;
if (pendingJoin) {
  mode(true);
  db.collection("invites").doc(pendingJoin).get().then(d => { const b = $("#inv"); b.classList.remove("hide"); b.textContent = d.exists && d.data().expiresAt > Date.now() ? "Tu es invité à rejoindre « " + d.data().convName + " ». Crée un compte (ou connecte-toi) pour entrer dans le groupe." : "Ce lien d’invitation est invalide ou expiré."; }).catch(() => {});
}
auth.onAuthStateChanged(u => {
  if (!u) { stop(); stopGuard(); listUn && listUn(); me = null; cur = null; $("#app").classList.add("hide"); $("#auth").classList.remove("hide"); return; }
  me = { uid: u.uid, name: u.displayName || "Joueur" }; start();
});

/* ---------- App ---------- */
function start() {
  $("#auth").classList.add("hide"); $("#app").classList.remove("hide"); $("#mn").textContent = me.name;
  db.collection("users").doc(me.uid).set({ name: me.name, nameLower: clean(me.name) }, { merge: true }).catch(() => {});
  try { me.mcName = localStorage.getItem("mcName") || null; } catch (e) { }
  db.collection("users").doc(me.uid).get().then(d => { if (d.exists && d.data().mcName) { me.mcName = d.data().mcName; try { localStorage.setItem("mcName", me.mcName); } catch (e) { } } }).catch(() => {});
  if (pendingJoin && !registering) joinInvite();
  listUn && listUn();
  listUn = db.collection("conversations").where("members", "array-contains", me.uid).onSnapshot(s => {
    convs = s.docs.filter(d => !d.metadata.hasPendingWrites).map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 9e9) - (a.createdAt?.seconds || 9e9));
    drawList(); startGuard();
    if (pendingOpen) { const pc = convs.find(x => x.id === pendingOpen); if (pc) { pendingOpen = null; open(pc); } }
    if (cur) { const c = convs.find(x => x.id === cur.id); if (c) { const was = JSON.stringify(cur.mc || {}); cur = c; head(); if (cur.type === "mc" && (tab === "srv" || tab === "world") && was !== JSON.stringify(c.mc || {})) show(); } }
  }, e => toast("Erreur : " + e.message));
  if (!cur) home();
}
function title(c) {
  if (c.type === "dm") return Object.entries(c.names || {}).filter(([k]) => k !== me.uid).map(([, v]) => v)[0] || "Discussion";
  return c.name;
}
function drawList() {
  const l = $("#list"); l.textContent = "";
  if (!convs.length) { l.append(Object.assign(el("p", "sub", "Aucune conversation pour l’instant. Crée un groupe ou écris à un ami avec « Nouveau »."), { style: "padding:12px" })); return; }
  convs.forEach(c => {
    const b = el("button", "ci" + (cur && cur.id === c.id ? " on" : "")), a = el("div", "av" + (c.type === "mc" ? " mc" : ""), c.type === "mc" ? "⛏" : title(c).slice(0, 1).toUpperCase());
    const d = el("div"); d.append(el("div", "n", title(c)), el("div", "s", c.type === "mc" ? "Groupe Minecraft" : c.type === "dm" ? "Message privé" : `Groupe · ${c.members.length} membres`));
    b.append(a, d); b.onclick = () => open(c); l.append(b);
  });
}
function home() {
  stop(); cur = null; drawList(); const m = $("#main"); m.textContent = "";
  const t = el("div", "top"), bg = el("button", "", "☰"); bg.id = "burger"; bg.onclick = () => side(true); t.append(bg, el("h2", "", "Bienvenue " + me.name));
  const e = el("div", "empty"); e.append(el("h3", "", "Choisis une conversation"), el("p", "", "Ouvre une discussion dans la liste, ou crée un groupe Minecraft pour connecter ton serveur."));
  m.append(t, e);
}
function side(o) { $("#side").classList.toggle("open", o); $("#cl").style.display = o ? "" : "none"; }
$("#cl").onclick = () => side(false);
function open(c) { cur = c; tab = "chat"; adminOK = false; side(false); drawList(); shell(); show(); }
function shell() {
  const m = $("#main"); m.textContent = "";
  const t = el("div", "top"), bg = el("button", "", "☰"); bg.id = "burger"; bg.onclick = () => side(true);
  const h = el("h2"); h.id = "ct"; t.append(bg, h);
  if (cur.type !== "dm") { const a = el("button", "btn sm ghost", "+ Membre"); a.onclick = addMember; t.append(a); }
  m.append(t);
  if (cur.type === "mc") { const mt = el("div", "mt"); mt.id = "mt"; [["chat", "Discussion"], ["srv", "Serveur"], ["map", "Carte"], ["world", "Monde"], ["sec", "Sécurité"], ["adm", "Admin"]].forEach(([k, v]) => { const b = el("button", "", v); b.dataset.k = k; b.onclick = () => { tab = k; show(); }; mt.append(b); }); m.append(mt); }
  const v = el("div", "view"); v.id = "vw"; m.append(v); head();
}
function head() { const h = $("#ct"); if (h) h.textContent = title(cur); }
function show() {
  stop(); document.querySelectorAll("#mt button").forEach(b => b.classList.toggle("on", b.dataset.k === tab));
  const v = $("#vw"); v.textContent = "";
  ({ chat: vChat, srv: vSrv, map: vMap, world: vWorld, sec: vSec, adm: vAdm })[tab](v);
}
const sub = c => db.collection("conversations").doc(cur.id).collection(c);
let lastPlayers = [];
const watchState = cb => sub("mc").doc("state").onSnapshot(sn => { lastPlayers = (sn.data() && sn.data().players) || []; cb(sn); }, e => toast("Erreur : " + e.message));
const MCRE = /^[A-Za-z0-9_]{1,16}$/;
async function saveMc() {
  const v = prompt("Ton pseudo Minecraft, exactement comme en jeu :", me.mcName || ""); if (v === null) return null;
  const x = v.trim();
  if (!MCRE.test(x)) { toast("Pseudo invalide : lettres, chiffres et _ seulement (les pseudos Minecraft n’ont pas de tiret)."); return null; }
  me.mcName = x; try { localStorage.setItem("mcName", x); } catch (e) { }
  db.collection("users").doc(me.uid).set({ mcName: x }, { merge: true }).catch(() => {});
  toast("Pseudo enregistré : " + x); return x;
}
async function tpTo(target) {
  if (!MCRE.test(target)) return;
  const n = me.mcName || await saveMc(); if (!n) return;
  if (n.toLowerCase() === target.toLowerCase()) return toast("C’est ton propre personnage.");
  const mine = lastPlayers.find(p => p.name.toLowerCase() === n.toLowerCase());
  if (!mine) return toast("« " + n + " » n’est pas connecté sur le serveur. Mauvais pseudo ? Utilise « Mon pseudo » pour le changer.");
  try { await sub("commands").add({ type: "cmd", arg: "tp " + mine.name + " " + target, by: me.name, status: "pending", createdAt: FV.serverTimestamp() }); toast("Téléportation vers " + target + "…"); } catch (x) { toast(x.message); }
}
function playerRows(box, arr) {
  box.textContent = "";
  if (!arr.length) { box.append(el("p", "sub", "Personne en ligne.")); return; }
  arr.forEach(x => { const r = el("div", "pl"), b = el("button", "btn sm ghost", "Se téléporter"); b.onclick = () => tpTo(x.name); r.append(el("span", "", x.name), b); box.append(r); });
}

async function sendCmd(type, arg) {
  try { await sub("commands").add({ type, arg: arg || "", by: me.name, status: "pending", createdAt: FV.serverTimestamp() }); toast("Commande envoyée."); } catch (x) { toast(x.message); }
}
let zonesAll = [], zonesUn = null, guardUn = {}, inside = {}, alertLog = [], pendingOpen = null;
const zoneCbs = new Set();
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); setTimeout(() => { o.stop(); a.close(); }, 450); } catch (e) { } }
function startGuard() {
  if (!me) return;
  if (!zonesUn) zonesUn = db.collection("zones").where("owner", "==", me.uid).onSnapshot(s => { zonesAll = s.docs.map(d => ({ id: d.id, ...d.data() })); zoneCbs.forEach(f => f()); }, () => {});
  convs.filter(c => c.type === "mc").forEach(c => {
    if (guardUn[c.id]) return;
    guardUn[c.id] = db.collection("conversations").doc(c.id).collection("mc").doc("state").onSnapshot(s => checkZones(c, (s.data() && s.data().players) || []), () => {});
  });
}
function stopGuard() { zonesUn && zonesUn(); zonesUn = null; Object.values(guardUn).forEach(f => f()); guardUn = {}; inside = {}; zonesAll = []; }
function checkZones(c, players) {
  const mine = (me.mcName || "").toLowerCase(); if (!mine) return;
  zonesAll.filter(z => z.convId === c.id && z.enabled !== false).forEach(z => {
    const ok = (z.allowed || []).map(x => x.toLowerCase());
    const now = new Set(players.filter(p => p.name.toLowerCase() !== mine && !ok.includes(p.name.toLowerCase()) && Math.hypot(p.x - z.cx, p.z - z.cz) <= z.r).map(p => p.name));
    const prev = inside[z.id] || new Set();
    now.forEach(n => { if (!prev.has(n)) alertZone(c, z, n); });
    inside[z.id] = now;
  });
}
function alertZone(c, z, who) {
  const text = "🚨 " + who + " est entré dans ta zone « " + z.name + " » (" + title(c) + ")";
  alertLog.unshift({ t: Date.now(), convId: c.id, text }); alertLog = alertLog.slice(0, 50);
  toast(text, 9000); beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { }
  try { if (window.Notification && Notification.permission === "granted") new Notification("HMD Hub — zone de sécurité", { body: text }); } catch (e) { }
  zoneCbs.forEach(f => f());
}
function banBox() {
  const b = el("div", "box"), r = el("div", "row"), bb = el("button", "btn sm bad", "Bannir"), ub = el("button", "btn sm ghost", "Débannir");

    bar.prepend(dzb); zoneCbs.add(draw); unsubs.push(() => zoneCbs.delete(draw));
    p.append(bar, cv, el("p", "sub", "Glisse pour te déplacer, molette ou deux doigts pour zoomer. « Dessiner une zone » : appuie au centre puis glisse pour tracer le cercle."));
  }

  else {
    const ed = el("div", "box"), fi = el("input"), r1 = el("div", "row"), r2 = el("div", "row"), sz = el("input"), op = el("input"), mode = el("button", "btn sm", "Mode : déplacer la vue");
    fi.type = "file"; fi.accept = "image/*";
    sz.type = op.type = "range"; sz.min = -5; sz.max = 6; sz.step = .01; op.min = .1; op.max = 1; op.step = .05; op.value = .8;
    const lab = (t, i) => { const d = el("label", "sub", t); d.style.cssText = "display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px"; d.append(i); return d; };
    const need = () => { if (!IMG) { toast("Choisis d’abord une image."); return false; } return true; };
    fi.onchange = async () => {
      const f = fi.files[0]; if (!f) return;
      try {
        const data = await fileToData(f); if (!data) return toast("Image trop lourde, essaie une image plus simple.");
        const r = size(); IMG = { data, cx: V.x, cz: V.z, bpp: 1, op: +op.value };
        img.onload = () => { IMG.bpp = Math.max(.05, (r.width / V.k * .8) / img.naturalWidth); sz.value = Math.log2(IMG.bpp); draw(); persist(true); }; img.src = data;
      } catch (e) { toast("Image illisible."); }
    };
    sz.oninput = () => { if (IMG) { IMG.bpp = Math.pow(2, +sz.value); draw(); onImgChange(); } };
    op.oninput = () => { if (IMG) { IMG.op = +op.value; draw(); onImgChange(); } };
    mode.onclick = () => { if (!need()) return; imgMode = !imgMode; mode.textContent = imgMode ? "Mode : déplacer l’image" : "Mode : déplacer la vue"; cv.style.cursor = imgMode ? "move" : "grab"; };
    const ctr = el("button", "btn sm ghost", "Centrer l’image sur la vue"); ctr.onclick = () => { if (need()) { IMG.cx = V.x; IMG.cz = V.z; draw(); onImgChange(); } };
    const persist = async quiet => { if (!IMG) return; try { await sub("mc").doc("mapimg").set({ data: IMG.data, cx: IMG.cx, cz: IMG.cz, bpp: IMG.bpp, op: IMG.op, updatedAt: FV.serverTimestamp() }); if (!quiet) toast("Image enregistrée : tout le monde la voit."); } catch (e) { toast("Erreur : " + e.message); } };
    let t = null; onImgChange = () => { clearTimeout(t); t = setTimeout(() => persist(true), 700); };
    const save = el("button", "btn sm", "Enregistrer pour tout le monde"), del = el("button", "btn sm bad", "Supprimer l’image");
    save.onclick = async () => {
      if (!need()) return;
      persist(false);
    };
    del.onclick = async () => { if (!confirm("Supprimer l’image de la carte ?")) return; try { await sub("mc").doc("mapimg").delete(); IMG = null; img.removeAttribute("src"); draw(); toast("Image supprimée."); } catch (e) { toast(e.message); } };
    r1.append(mode, ctr); r2.append(lab("Taille de l’image", sz), lab("Transparence", op));
    ed.append(el("p", "sub", "1. Connecte-toi sur le serveur : ton point apparaît sur la carte.\n2. Choisis une image, passe en « déplacer l’image » et glisse-la pour que les points des joueurs tombent au bon endroit. Ajuste la taille.\n3. Repasse en « déplacer la vue » pour te déplacer ou zoomer, puis enregistre."), fi, r1, r2, el("div", "row")); ed.lastChild.append(save, del);
    p.append(bar, cv, ed);
  }
  v.append(p);
  unsubs.push(watchState(s => { pl = (s.data() && s.data().players) || []; if (!fitted) { fit(); fitted = pl.length > 0; } draw(); if (!edit) { box.textContent = ""; box.append(el("b", "", "Joueurs en ligne")); const l = el("div"); playerRows(l, pl); box.append(l); } }));
  unsubs.push(sub("mc").doc("mapimg").onSnapshot(sn => { if (sn.metadata && sn.metadata.hasPendingWrites) return; const d = sn.data(); IMG = d && d.data ? { data: d.data, cx: d.cx, cz: d.cz, bpp: d.bpp, op: d.op } : null; if (IMG && img.getAttribute("src") !== IMG.data) { img.onload = () => { if (!fitted && !pl.length) fit(); draw(); }; img.src = IMG.data; } else draw(); }, () => {}));
  addEventListener("resize", draw); unsubs.push(() => removeEventListener("resize", draw)); requestAnimationFrame(draw);
}

/* ---------- Sécurité ---------- */
function vSec(v) {
  const p = el("div", "pad"), info = el("div", "box"), mapb = el("div", "box"), lst = el("div", "box"), log = el("div", "box");
  const r1 = el("div", "row"), nb = el("button", "btn sm ghost", "Activer les notifications"), mb = el("button", "btn sm ghost", me.mcName ? "Mon pseudo : " + me.mcName : "Définir mon pseudo Minecraft");
  nb.onclick = async () => { try { const r = await Notification.requestPermission(); toast(r === "granted" ? "Notifications activées." : "Notifications refusées."); } catch (e) { toast("Notifications indisponibles ici."); } };
  mb.onclick = async () => { if (await saveMc()) mb.textContent = "Mon pseudo : " + me.mcName; };
  r1.append(nb, mb);
  info.append(el("b", "", "Zones de sécurité"), el("p", "sub", "Entoure un endroit sur la carte. Si un autre joueur y entre, tu reçois une alerte (message, son, notification). Les zones sont privées : chacun a les siennes.\nLe site doit rester ouvert, même en arrière-plan, pour recevoir les alertes. Ton pseudo Minecraft sert à ne pas t’alerter toi-même."), r1);
  const mh = el("div"); mapb.append(mh); vMap(mh, "zone");
  const render = () => {
    lst.textContent = ""; lst.append(el("b", "", "Mes zones"));
    const zs = zonesAll.filter(z => z.convId === cur.id);
    if (!zs.length) lst.append(el("p", "sub", "Aucune zone pour l’instant."));
    zs.forEach(z => {
      const r = el("div", "pl"), t = el("span", "", z.name + " · rayon " + z.r + " blocs" + (z.enabled === false ? " (désactivée)" : "") + ((z.allowed || []).length ? " · autorisés : " + z.allowed.join(", ") : ""));
      const bx = el("div", "row"), on = el("button", "btn sm ghost", z.enabled === false ? "Activer" : "Désactiver"), al = el("button", "btn sm ghost", "Autorisés"), de = el("button", "btn sm bad", "Supprimer");
      on.onclick = () => db.collection("zones").doc(z.id).update({ enabled: z.enabled === false }).catch(e => toast(e.message));
      al.onclick = () => { const x = prompt("Joueurs autorisés dans cette zone (pseudos Minecraft séparés par des virgules) :", (z.allowed || []).join(", ")); if (x === null) return; const arr = x.split(",").map(q => q.trim()).filter(Boolean); if (arr.some(q => !MCRE.test(q))) return toast("Pseudo invalide."); db.collection("zones").doc(z.id).update({ allowed: arr }).catch(e => toast(e.message)); };
      de.onclick = () => confirm("Supprimer la zone « " + z.name + " » ?") && db.collection("zones").doc(z.id).delete().catch(e => toast(e.message));
      bx.append(on, al, de); r.append(t, bx); lst.append(r);
    });
    log.textContent = ""; log.append(el("b", "", "Dernières alertes"));
    const al2 = alertLog.filter(a => a.convId === cur.id).slice(0, 15);
    if (!al2.length) log.append(el("p", "sub", "Aucune alerte depuis l’ouverture du site."));
    al2.forEach(a => log.append(el("div", "pl", new Date(a.t).toLocaleTimeString("fr-FR") + " — " + a.text)));
  };
  render(); zoneCbs.add(render); unsubs.push(() => zoneCbs.delete(render));
  p.append(info, mapb, lst, log); v.append(p);
}

/* ---------- Monde (Squaremap) ---------- */

  else {
    b.append(el("div", "cmd", u));

    else { const a = el("a", "btn", "Ouvrir la carte dans un nouvel onglet"); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.style.cssText = "text-align:center;text-decoration:none"; b.append(a, el("p", "sub", "Ton site est en https : le navigateur refuse d’afficher une carte en http à l’intérieur de la page, donc elle s’ouvre dans un onglet. Pour l’intégrer ici, il faut une adresse https.")); }

/* ---------- Vote & Quiz ---------- */
const QUIZ = [
  ["Quelle est la capitale de la France ?", "Paris", "Marseille", 1],
  ["Quel mob explose quand il s’approche de toi ?", "Zombie", "Creeper", 2],
  ["Quel objet sert à activer le portail de l’End ?", "Œil d’Ender", "Perle de redstone", 1],
  ["Dans quelle dimension trouve-t-on les Ghasts ?", "L’End", "Le Nether", 2],
  ["Combien de cœurs de vie a un joueur ?", "10", "20", 1],
  ["Combien d’obsidienne faut-il au minimum pour un portail du Nether ?", "10", "14", 1],
  ["Quel est le plus grand océan du monde ?", "Atlantique", "Pacifique", 2],
  ["Combien y a-t-il de planètes dans le système solaire ?", "9", "8", 2],
  ["Qui a créé Minecraft ?", "Markus « Notch » Persson", "Steve Jobs", 1],
  ["Combien font 7 × 8 ?", "54", "56", 2],
  ["Quel métal est liquide à température ambiante ?", "Mercure", "Fer", 1],
  ["Quel animal peut-on traire avec un seau ?", "Cochon", "Vache", 2]
];
let game = null;
async function botSay(text) {
  let ref = null;
  try { ref = await sub("messages").add({ uid: me.uid, name: "🤖 HMD Bot", text, src: "web", createdAt: FV.serverTimestamp() }); } catch (x) { toast(x.message); }
  try { await sub("commands").add({ type: "cmd", arg: "say " + text.replace(/\n/g, " | "), by: me.name, status: "pending", createdAt: FV.serverTimestamp() }); } catch (x) { }
  return ref;
}
async function launch(kind, qs, A, correct, secs) {
  if (game) return toast("Une partie est déjà en cours.");
  const g = game = { kind, A, correct, votes: {}, start: Date.now(), end: Date.now() + secs * 1000 };
  const ref = await botSay((kind === "vote" ? "📊 VOTE : " : "🎮 QUIZ : ") + qs + "\n1 → " + A[0] + "\n2 → " + A[1] + "\nÉcris 1 ou 2 dans le chat ! (" + secs + " s)");
  if (!ref) { game = null; return; }
  try { const s = await ref.get(); g.start = s.data().createdAt?.toMillis?.() || g.start; } catch (e) { }
  g.un = sub("messages").orderBy("createdAt", "desc").limit(100).onSnapshot(s => {
    s.docs.forEach(d => {
      const m = d.data(), t = m.createdAt?.toMillis?.();
      if (!t || t < g.start || m.name === "🤖 HMD Bot") return;
      const x = (m.text || "").trim(); if (x !== "1" && x !== "2") return;
      const old = g.votes[m.name];
      if (old && (g.kind === "quiz" ? old.t <= t : old.t >= t)) return; // quiz : 1re réponse / vote : dernier choix
      g.votes[m.name] = { o: +x, t };
    });
    g.upd && g.upd();
  });
  g.i = setInterval(() => g.upd && g.upd(), 1000);
  g.t = setTimeout(endGame, secs * 1000);
}
function endGame() {
  const g = game; if (!g) return; game = null; clearTimeout(g.t); clearInterval(g.i); g.un && g.un();
  const v = Object.entries(g.votes).sort((a, b) => a[1].t - b[1].t), by = o => v.filter(([, x]) => x.o === o).map(([n]) => n);
  let txt;
  if (g.kind === "vote") {
    const c1 = by(1).length, c2 = by(2).length, tot = c1 + c2, pc = n => tot ? Math.round(n * 100 / tot) : 0;
    txt = `📊 Résultats : 1 → ${g.A[0]} : ${c1} (${pc(c1)}%) | 2 → ${g.A[1]} : ${c2} (${pc(c2)}%)\n` + (!tot ? "Personne n’a voté." : c1 === c2 ? "Égalité !" : "Gagnant : " + g.A[c1 > c2 ? 0 : 1]);
  } else {
    const ok = by(g.correct), ko = by(g.correct === 1 ? 2 : 1);
    txt = `🎮 Bonne réponse : ${g.correct} → ${g.A[g.correct - 1]}\n✅ Bravo : ${ok.length ? ok.join(", ") : "personne"}\n❌ Raté : ${ko.length ? ko.join(", ") : "personne"}`;
  }
  botSay(txt); g.upd && g.upd();
}
function gameBox() {
  const b = el("div", "box"), st = el("div", "sub"), kt = el("div", "tabs"), q = el("input"), a1 = el("input"), a2 = el("input"), sel = el("select"), dur = el("input"), r = el("div", "row");
  let kind = "vote";
  q.placeholder = "Question"; a1.placeholder = "Option 1"; a2.placeholder = "Option 2";
  dur.type = "number"; dur.min = 10; dur.max = 300; dur.value = 30; dur.placeholder = "Durée (secondes)";
  sel.append(new Option("Bonne réponse : 1", 1), new Option("Bonne réponse : 2", 2)); sel.classList.add("hide");
  [["vote", "Vote"], ["quiz", "Quiz"]].forEach(([k, t]) => {
    const x = el("button", k === kind ? "on" : "", t); x.type = "button";
    x.onclick = () => { kind = k; [...kt.children].forEach(y => y.classList.toggle("on", y === x)); sel.classList.toggle("hide", k === "vote"); };
    kt.append(x);
  });
  const secs = () => Math.min(300, Math.max(10, +dur.value || 30));
  const upd = () => { st.textContent = game ? `En cours : ${Object.keys(game.votes).length} réponse(s), ${Math.max(0, Math.ceil((game.end - Date.now()) / 1000))} s restantes` : "Aucune partie en cours."; };
  const run = async (k, qs, A, c) => { await launch(k, qs, A, c, secs()); if (game) game.upd = upd; upd(); };
  const go = el("button", "btn", "Lancer"), rnd = el("button", "btn ghost", "Quiz au hasard"), end = el("button", "btn bad", "Terminer");
  go.onclick = () => { if (!q.value.trim() || !a1.value.trim() || !a2.value.trim()) return toast("Remplis la question et les deux options."); run(kind, q.value.trim(), [a1.value.trim(), a2.value.trim()], +sel.value); };
  rnd.onclick = () => { const x = QUIZ[Math.floor(Math.random() * QUIZ.length)]; run("quiz", x[0], [x[1], x[2]], x[3]); };
  end.onclick = () => endGame();
  r.append(go, rnd, end);
  b.append(el("b", "", "Vote & Quiz"), el("p", "sub", "Les joueurs répondent en tapant 1 ou 2 dans le chat (site ou Minecraft)."), kt, q, a1, a2, sel, dur, r, st);
  if (game) game.upd = upd; upd();
  return b;
}

/* ---------- Admin ---------- */
function vAdm(v) {
  if (!adminOK) {
    const e = el("div", "pad"), b = el("form", "box"), i = el("input"); i.type = "password"; i.placeholder = "Mot de passe admin"; const er = el("div", "err");
    b.style.cssText = "max-width:380px;margin:auto;width:100%"; b.append(el("b", "", "Mode admin"), el("p", "sub", "Entre le mot de passe pour piloter le serveur."), i, er, el("button", "btn", "Déverrouiller")); e.append(b); v.append(e);
    b.onsubmit = x => { x.preventDefault(); if (i.value === ADMIN_PW) { adminOK = true; show(); } else er.textContent = "Mot de passe incorrect."; };
    return;
  }
  const p = el("div", "pad"), pb = el("div", "box"), cb = el("div", "box"), con = el("div"); con.id = "con";
  const send = async (type, arg) => { try { await sub("commands").add({ type, arg: arg || "", by: me.name, status: "pending", createdAt: FV.serverTimestamp() }); toast("Commande envoyée."); } catch (x) { toast(x.message); } };
  const q = el("div", "row");
  [["Sauvegarder", () => send("cmd", "save-all")], ["Jour", () => send("cmd", "time set day")], ["Soleil", () => send("cmd", "weather clear")], ["Annonce", () => { const t = prompt("Message à diffuser :"); t && send("cmd", "say " + t); }], ["Éteindre le serveur", () => confirm("Éteindre le serveur ?") && send("stop")]].forEach(([t, f], k) => { const b = el("button", "btn sm " + (k === 4 ? "bad" : "ghost"), t); b.onclick = f; q.append(b); });
  cb.append(el("b", "", "Actions rapides"), q);
  pb.append(el("b", "", "Joueurs connectés")); const pl = el("div"); pb.append(pl);
  const cf = el("form", "compose"), ci = el("input"); ci.placeholder = "Commande (sans /)"; ci.autocomplete = "off"; cf.style.cssText = "padding:0;background:none;border:0"; cf.append(ci, el("button", "btn", "Exécuter"));
  cf.onsubmit = e => { e.preventDefault(); const t = ci.value.trim().replace(/^\//, ""); if (t) { send("cmd", t); ci.value = ""; } };
  const cc = el("div", "box"); cc.append(el("b", "", "Console"), con, cf);
  const mb2 = el("div", "box"), mh = el("div"); mb2.append(el("b", "", "Image de la carte"), mh); vMap(mh, true);
  p.append(cb, banBox(), mb2, gameBox(), pb, cc); v.append(p);
  unsubs.push(watchState(s => {
    pl.textContent = ""; const a = s.data()?.players || [];
    if (!a.length) pl.append(el("p", "sub", "Personne en ligne."));
    a.forEach(x => { const r = el("div", "pl"), k = el("button", "btn sm bad", "Expulser"); k.onclick = () => { const why = prompt("Raison (facultatif) :", ""); if (why !== null) send("kick", x.name + (why ? " " + why : "")); }; r.append(el("span", "", x.name), k); pl.append(r); });
  }));
  unsubs.push(sub("console").orderBy("createdAt", "desc").limit(200).onSnapshot(s => { con.textContent = s.docs.map(d => d.data().line).reverse().join("\n") || "En attente de la console du serveur…"; con.scrollTop = con.scrollHeight; }));
}
